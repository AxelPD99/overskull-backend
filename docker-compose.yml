services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: overskull-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - overskull

  nginx:
    image: nginx:alpine
    container_name: overskull-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - overskull

  mysql:
    image: mysql:8.4
    container_name: overskull-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: overskull_db
      MYSQL_ROOT_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - overskull_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-padmin"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - overskull

networks:
  overskull:

volumes:
  overskull_mysql_data: